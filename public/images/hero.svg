<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Bright Dallas living room interior in warm tones">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0E9DA"/>
      <stop offset="1" stop-color="#E2D6BC"/>
    </linearGradient>
    <linearGradient id="heroWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5EFE2"/>
      <stop offset="1" stop-color="#E7DCC3"/>
    </linearGradient>
    <linearGradient id="heroFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B48A"/>
      <stop offset="1" stop-color="#A38E61"/>
    </linearGradient>
    <linearGradient id="heroSofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B5A4F"/>
      <stop offset="1" stop-color="#26433A"/>
    </linearGradient>
  </defs>

  <!-- Back wall -->
  <rect width="800" height="620" fill="url(#heroWall)"/>
  <!-- Floor -->
  <rect y="620" width="800" height="380" fill="url(#heroFloor)"/>
  <!-- Window light wash -->
  <rect x="60" y="120" width="240" height="380" fill="#FBF6E8" opacity="0.55"/>
  <rect x="60" y="120" width="240" height="380" fill="none" stroke="#B7A37A" stroke-width="2"/>
  <line x1="180" y1="120" x2="180" y2="500" stroke="#B7A37A" stroke-width="2"/>
  <line x1="60" y1="310" x2="300" y2="310" stroke="#B7A37A" stroke-width="2"/>

  <!-- Plant left -->
  <ellipse cx="40" cy="700" rx="60" ry="20" fill="#9C8C5F" opacity="0.4"/>
  <path d="M40 700 L60 540 L80 700 Z" fill="#173F35" opacity="0.85"/>
  <path d="M20 690 Q40 560 60 540 Q40 590 30 690 Z" fill="#1F4F40"/>
  <path d="M60 690 Q80 580 100 540 Q70 600 70 690 Z" fill="#264F3F"/>
  <rect x="30" y="680" width="60" height="20" rx="3" fill="#3B3327"/>

  <!-- Sofa -->
  <rect x="220" y="540" width="420" height="160" rx="20" fill="url(#heroSofa)"/>
  <rect x="220" y="500" width="420" height="60" rx="18" fill="#335148"/>
  <rect x="240" y="520" width="110" height="40" rx="10" fill="#26433A"/>
  <rect x="370" y="520" width="110" height="40" rx="10" fill="#26433A"/>
  <rect x="500" y="520" width="120" height="40" rx="10" fill="#26433A"/>
  <rect x="220" y="700" width="420" height="20" fill="#1A3129"/>
  <rect x="220" y="540" width="12" height="160" fill="#1A3129"/>
  <rect x="628" y="540" width="12" height="160" fill="#1A3129"/>

  <!-- Throw pillow (sand accent) -->
  <rect x="500" y="540" width="100" height="60" rx="10" fill="#DCC9A3"/>
  <rect x="510" y="550" width="80" height="40" rx="6" fill="#C9B58A"/>

  <!-- Side table + lamp right -->
  <rect x="660" y="560" width="100" height="160" fill="#7A5A3A"/>
  <rect x="660" y="560" width="100" height="14" fill="#5A4128"/>
  <rect x="690" y="430" width="40" height="130" fill="#7A5A3A"/>
  <ellipse cx="710" cy="430" rx="60" ry="22" fill="#DCC9A3"/>
  <path d="M650 430 L770 430 L760 410 L660 410 Z" fill="#E5D3AC"/>
  <ellipse cx="710" cy="406" rx="55" ry="14" fill="#F1E2BE"/>

  <!-- Book stack on table -->
  <rect x="668" y="525" width="40" height="6" fill="#26433A"/>
  <rect x="668" y="531" width="36" height="6" fill="#8FAF9F"/>
  <rect x="668" y="537" width="30" height="6" fill="#DCC9A3"/>

  <!-- Rug on floor -->
  <ellipse cx="430" cy="850" rx="320" ry="60" fill="#DCC9A3" opacity="0.6"/>
  <ellipse cx="430" cy="850" rx="280" ry="44" fill="#C7B388" opacity="0.55"/>

  <!-- Hanging frame on wall -->
  <rect x="380" y="220" width="180" height="220" fill="#F7F1E0" stroke="#A38E61" stroke-width="3"/>
  <line x1="380" y1="320" x2="560" y2="320" stroke="#C7B388" stroke-width="2"/>
  <path d="M390 400 Q470 360 550 400 L550 420 L390 420 Z" fill="#8FAF9F" opacity="0.6"/>
  <circle cx="450" cy="270" r="14" fill="#DCC9A3"/>

  <!-- Subtle grain -->
  <rect width="800" height="1000" fill="#173F35" opacity="0.03"/>
</svg>
