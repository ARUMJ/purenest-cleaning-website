<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Clean, professional commercial interior suitable for a small business environment">
  <defs>
    <linearGradient id="cmWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE7D2"/>
      <stop offset="1" stop-color="#DCC9A3"/>
    </linearGradient>
    <linearGradient id="cmFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8A29A"/>
      <stop offset="1" stop-color="#7A756C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#cmWall)"/>
  <rect y="400" width="800" height="200" fill="url(#cmFloor)"/>

  <!-- Floor tile grid -->
  <g opacity="0.25">
    <line x1="0" y1="430" x2="800" y2="430" stroke="#5A554D"/>
    <line x1="0" y1="470" x2="800" y2="470" stroke="#5A554D"/>
    <line x1="0" y1="520" x2="800" y2="520" stroke="#5A554D"/>
    <line x1="0" y1="570" x2="800" y2="570" stroke="#5A554D"/>
    <line x1="200" y1="400" x2="200" y2="600" stroke="#5A554D"/>
    <line x1="400" y1="400" x2="400" y2="600" stroke="#5A554D"/>
    <line x1="600" y1="400" x2="600" y2="600" stroke="#5A554D"/>
  </g>

  <!-- Big window with city silhouette -->
  <rect x="80" y="60" width="640" height="240" fill="#F4ECDA" stroke="#A38E61" stroke-width="2"/>
  <g opacity="0.6">
    <rect x="120" y="180" width="40" height="120" fill="#8FAF9F"/>
    <rect x="170" y="140" width="50" height="160" fill="#26433A"/>
    <rect x="230" y="200" width="40" height="100" fill="#8FAF9F"/>
    <rect x="280" y="120" width="60" height="180" fill="#26433A"/>
    <rect x="350" y="170" width="40" height="130" fill="#173F35"/>
    <rect x="400" y="150" width="50" height="150" fill="#26433A"/>
    <rect x="460" y="200" width="40" height="100" fill="#8FAF9F"/>
    <rect x="510" y="130" width="50" height="170" fill="#26433A"/>
    <rect x="570" y="180" width="40" height="120" fill="#8FAF9F"/>
    <rect x="620" y="160" width="50" height="140" fill="#26433A"/>
  </g>
  <line x1="400" y1="60" x2="400" y2="300" stroke="#A38E61" stroke-width="2"/>
  <line x1="80" y1="180" x2="720" y2="180" stroke="#A38E61" stroke-width="2"/>

  <!-- Reception desk -->
  <rect x="160" y="380" width="480" height="80" fill="#26433A"/>
  <rect x="160" y="360" width="480" height="20" fill="#173F35"/>
  <rect x="160" y="380" width="20" height="100" fill="#0F2620"/>
  <rect x="620" y="380" width="20" height="100" fill="#0F2620"/>
  <rect x="160" y="480" width="480" height="6" fill="#0F2620"/>

  <!-- Welcome sign on desk -->
  <rect x="340" y="320" width="120" height="40" fill="#F7F1E0" stroke="#A38E61"/>
  <text x="400" y="346" text-anchor="middle" fill="#26433A" font-family="Georgia, serif" font-size="16" font-weight="500">Welcome</text>

  <!-- A small potted plant left of desk -->
  <rect x="80" y="420" width="60" height="40" fill="#3B3327"/>
  <path d="M110 420 Q90 360 100 320 Q110 360 120 420 Z" fill="#26433A"/>
  <path d="M110 420 Q130 370 140 340 Q120 380 120 420 Z" fill="#1F4F40"/>
  <ellipse cx="110" cy="420" rx="40" ry="6" fill="#0F2620" opacity="0.4"/>

  <!-- Pendant lights -->
  <line x1="240" y1="0" x2="240" y2="60" stroke="#26433A" stroke-width="2"/>
  <ellipse cx="240" cy="80" rx="30" ry="14" fill="#DCC9A3"/>
  <line x1="400" y1="0" x2="400" y2="60" stroke="#26433A" stroke-width="2"/>
  <ellipse cx="400" cy="80" rx="30" ry="14" fill="#DCC9A3"/>
  <line x1="560" y1="0" x2="560" y2="60" stroke="#26433A" stroke-width="2"/>
  <ellipse cx="560" cy="80" rx="30" ry="14" fill="#DCC9A3"/>

  <rect width="800" height="600" fill="#173F35" opacity="0.04"/>
</svg>
