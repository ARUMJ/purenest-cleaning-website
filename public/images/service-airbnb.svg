<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Tidy short-term rental guest area reset between stays">
  <defs>
    <linearGradient id="abW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EAD3"/>
      <stop offset="1" stop-color="#DCC9A3"/>
    </linearGradient>
    <linearGradient id="abF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2BA8A"/>
      <stop offset="1" stop-color="#A88E5C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" fill="url(#abW)"/>
  <rect y="380" width="800" height="220" fill="url(#abF)"/>

  <!-- Curtain -->
  <rect x="40" y="40" width="120" height="320" fill="#DCC9A3" opacity="0.85"/>
  <rect x="40" y="40" width="120" height="6" fill="#7A5A3A"/>
  <path d="M60 40 L60 360" stroke="#A38E61" opacity="0.4"/>
  <path d="M90 40 L90 360" stroke="#A38E61" opacity="0.4"/>
  <path d="M120 40 L120 360" stroke="#A38E61" opacity="0.4"/>

  <!-- Window behind curtain -->
  <rect x="80" y="60" width="80" height="280" fill="#FBF6E8" opacity="0.6"/>
  <line x1="120" y1="60" x2="120" y2="340" stroke="#A38E61"/>

  <!-- Bed frame + linens -->
  <rect x="240" y="280" width="500" height="100" rx="6" fill="#5A4128"/>
  <rect x="240" y="260" width="500" height="40" rx="6" fill="#7A5A3A"/>
  <!-- Mattress -->
  <rect x="260" y="200" width="460" height="80" fill="#FFFFFF" stroke="#A38E61"/>
  <!-- Duvet -->
  <path d="M260 280 L720 280 L720 260 Q480 240 260 260 Z" fill="#F7F1E0"/>
  <path d="M260 280 L720 280 L700 200 L280 200 Z" fill="#EFE7D2"/>
  <!-- Throw blanket (sand) -->
  <path d="M620 200 L720 200 L720 240 L660 240 Z" fill="#DCC9A3"/>
  <!-- Pillows -->
  <rect x="280" y="160" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#A38E61"/>
  <rect x="420" y="160" width="120" height="50" rx="8" fill="#F7F1E0" stroke="#A38E61"/>
  <rect x="560" y="160" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#A38E61"/>
  <!-- Decorative pillow (sage) -->
  <rect x="290" y="220" width="80" height="40" rx="8" fill="#8FAF9F"/>

  <!-- Bed legs -->
  <rect x="240" y="380" width="20" height="20" fill="#3B2A18"/>
  <rect x="720" y="380" width="20" height="20" fill="#3B2A18"/>

  <!-- Nightstand right -->
  <rect x="740" y="240" width="50" height="140" fill="#7A5A3A"/>
  <rect x="740" y="240" width="50" height="10" fill="#5A4128"/>
  <rect x="750" y="260" width="30" height="30" fill="#26433A"/>
  <circle cx="765" cy="240" r="10" fill="#DCC9A3"/>

  <!-- Floor rug -->
  <ellipse cx="490" cy="540" rx="280" ry="36" fill="#26433A" opacity="0.85"/>
  <ellipse cx="490" cy="540" rx="240" ry="24" fill="#173F35"/>

  <!-- Wall art above bed -->
  <rect x="380" y="80" width="220" height="100" fill="#F7F1E0" stroke="#A38E61" stroke-width="2"/>
  <line x1="400" y1="140" x2="580" y2="140" stroke="#8FAF9F" stroke-width="3"/>
  <path d="M410 130 Q490 90 570 130" fill="none" stroke="#26433A" stroke-width="3"/>

  <rect width="800" height="600" fill="#173F35" opacity="0.03"/>
</svg>
