<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Bright, organized residential living space cleaned and ready for daily life">
  <defs>
    <linearGradient id="resWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4ECDA"/>
      <stop offset="1" stop-color="#E2D5B6"/>
    </linearGradient>
    <linearGradient id="resFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2A878"/>
      <stop offset="1" stop-color="#9C8154"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" fill="url(#resWall)"/>
  <rect y="380" width="800" height="220" fill="url(#resFloor)"/>

  <!-- Window -->
  <rect x="80" y="60" width="200" height="260" fill="#FBF6E8" opacity="0.6" stroke="#A38E61" stroke-width="2"/>
  <line x1="180" y1="60" x2="180" y2="320" stroke="#A38E61" stroke-width="2"/>
  <line x1="80" y1="190" x2="280" y2="190" stroke="#A38E61" stroke-width="2"/>

  <!-- Coffee table -->
  <ellipse cx="430" cy="430" rx="160" ry="40" fill="#3B2A18"/>
  <ellipse cx="430" cy="420" rx="160" ry="40" fill="#5A4128"/>
  <ellipse cx="430" cy="414" rx="140" ry="30" fill="#3B2A18"/>

  <!-- Mugs on table -->
  <rect x="350" y="390" width="40" height="34" rx="4" fill="#F7F1E0"/>
  <ellipse cx="370" cy="390" rx="20" ry="6" fill="#8FAF9F"/>
  <rect x="350" y="424" width="40" height="6" fill="#5A4128"/>

  <rect x="450" y="384" width="36" height="38" rx="4" fill="#26433A"/>
  <ellipse cx="468" cy="384" rx="18" ry="5" fill="#1A3129"/>
  <rect x="450" y="422" width="36" height="6" fill="#5A4128"/>

  <!-- Open book -->
  <path d="M510 412 L580 400 L580 432 L510 444 Z" fill="#F7F1E0" stroke="#A38E61"/>
  <path d="M510 412 L540 408 L540 440 L510 444 Z" fill="#EFE7D2"/>
  <line x1="520" y1="420" x2="535" y2="418" stroke="#A38E61"/>
  <line x1="520" y1="426" x2="535" y2="424" stroke="#A38E61"/>
  <line x1="520" y1="432" x2="535" y2="430" stroke="#A38E61"/>
  <line x1="545" y1="416" x2="572" y2="412" stroke="#A38E61"/>
  <line x1="545" y1="422" x2="572" y2="418" stroke="#A38E61"/>

  <!-- Armchair right -->
  <path d="M620 250 Q700 250 700 320 L700 420 L620 420 Z" fill="#173F35"/>
  <path d="M620 250 Q660 230 700 250 L700 280 L620 280 Z" fill="#26433A"/>
  <rect x="620" y="280" width="80" height="20" fill="#1A3129"/>
  <rect x="620" y="420" width="80" height="14" fill="#0F2620"/>
  <rect x="612" y="300" width="14" height="120" fill="#0F2620"/>
  <rect x="694" y="300" width="14" height="120" fill="#0F2620"/>
  <!-- Cushion -->
  <rect x="635" y="290" width="50" height="40" rx="6" fill="#DCC9A3"/>

  <!-- Floor plant -->
  <ellipse cx="120" cy="500" rx="60" ry="12" fill="#000" opacity="0.2"/>
  <path d="M120 500 Q90 380 110 320 Q120 380 130 500 Z" fill="#26433A"/>
  <path d="M120 500 Q150 380 170 320 Q140 380 130 500 Z" fill="#1F4F40"/>
  <rect x="90" y="486" width="60" height="14" fill="#3B3327"/>

  <!-- Wall art -->
  <rect x="340" y="120" width="120" height="160" fill="#F7F1E0" stroke="#A38E61" stroke-width="2"/>
  <line x1="360" y1="240" x2="440" y2="240" stroke="#8FAF9F" stroke-width="3"/>
  <path d="M350 230 Q400 180 450 230" fill="none" stroke="#26433A" stroke-width="3"/>

  <!-- Soft floor rug -->
  <ellipse cx="430" cy="540" rx="280" ry="36" fill="#DCC9A3" opacity="0.55"/>

  <rect width="800" height="600" fill="#173F35" opacity="0.03"/>
</svg>
